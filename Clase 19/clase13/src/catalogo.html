<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Huellitas</title>
  <link rel="stylesheet" href="./recursos/estilos/index.css">
  <script type="module" src="./recursos/js/index.js"></script>
</head>
<body>
  <header>
    <a href="./index.html"><img src="./recursos/imagenes/mascotas.png" alt="Logo de Huellitas" width="64"></a>
    <nav aria-label="Navegación principal"><a href="./index.html">Inicio</a> <a href="./catalogo.html" aria-current="page">Catálogo</a> <a href="./contacto.html">Contacto</a></nav>
  </header>
  <main class="catalogo-pagina">
    <h1>Catálogo de Huellitas</h1>
    <p>Accesorios para acompañar cada paseo.</p>
    <div class="catalogo-controles"><label for="filtro-talle">Filtrar por talle:</label>
      <select id="filtro-talle"><option value="">Todos</option><option value="S">S</option><option value="M">M</option><option value="L">L</option></select></div>
    <p id="estado-catalogo" role="status" aria-live="polite"></p>
    <section aria-label="Productos" id="contenedor-productos"></section>
    <dialog id="detalle-producto" aria-labelledby="titulo-producto"><h2 id="titulo-producto"></h2><p id="descripcion-producto"></p><button id="cerrar-dialogo" type="button">Cerrar</button></dialog>
  </main>
  <footer><p>Huellitas · Caseros 100, Córdoba Capital</p></footer>
</body>
</html>
